name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar
        run: |
          set -eu
          nome="${GITHUB_REPOSITORY##*/}"
          versao="${GITHUB_REF_NAME#v}"
          declarada=$(node -p "require('./manifest.json').version")
          test "$declarada" = "$versao"
          mkdir pacote
          cp manifest.json README.md pacote/
          cp ./*.js pacote/
          (cd pacote && zip -r -X "../$nome-$versao.zip" .)
          sha256sum "$nome-$versao.zip" | tee "$nome-$versao.zip.sha256"
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nome="${GITHUB_REPOSITORY##*/}"
          versao="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$nome-$versao.zip" "$nome-$versao.zip.sha256" \
            --title "$nome $versao" \
            --notes "Pacote oficial da extensão Leveling Idle para o LionMultInstance."
